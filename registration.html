<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CatCon</title>
		<!-- Add favicon -->
		<link rel="icon" href="images/favicon.png" />
		<!-- Insert CSS -->
		<link rel="stylesheet" href="style/style.css" />
	</head>
	<body>
		<!-- A total container for header+main -->
		<div class="header-main-container">
			<header>
				<div class="burger-nav-dropdown">
					<img
						class="burger-dropbtn"
						src="images/burger-menu-icon.png"
						alt="Orange button for dropdown navigation menu."
					/>
					<div class="burger-dropdown-content">
						<a href="index.html">Home</a>
						<a href="registration.html">Registration</a>
						<a href="schedule.html">Schedule</a>
						<a href="sponsors.html">Sponsors</a>
						<a href="previousCon.html">Previous CaTCons</a>
					</div>
				</div>
				<div class="header-container">
					<!-- Add logo-Home 'Button' -->
					<a href="index.html" class="header-logo">
						<img
							src="images/logo.png"
							alt="Logo of Cat Con featuring a yellow cat paw in front of a blue global sphere"
						/>
					</a>
					<nav>
						<!-- Navigation menu for screens >768px -->
						<ul class="navigation-menu">
							<li>
								<a href="index.html">Home</a>
							</li>
							<li>
								<a href="registration.html">Registration</a>
							</li>
							<li>
								<a href="schedule.html">Schedule</a>
							</li>
							<li>
								<a href="sponsors.html">Sponsors</a>
							</li>
							<li>
								<a href="previousCon.html">Previous CaTCons</a>
							</li>
						</ul>
					</nav>
				</div>
			</header>
			<main>
				<div class="main-title-container">
					<div class="main-title-img">
						<img
							src="images/hero-kitty.png"
							alt="Orange cat in a Superman posture wearing a pink cape"
						/>
					</div>
					<h1>CatCon 2024</h1>
				</div>
				<div class="registration-container">
					<img
						class="registration-img"
						src="images/wrestler-kitty.png"
						alt="An orange cat wrestler, donning a vibrant blue mask with adorable yellow embellishments on its cheeks,"
					/>

					<div class="form-container">
						<h2 class="h2-registration">Registration Form</h2>
						<form>
							<label for="CatName" class="form-titles"
								>Cat Name</label
							>
							<input
								type="text"
								id="CatName"
								name="CatName"
								required
							/>
							<p class="form-titles">
								Choose your <span id="catvatar">Catvatar</span>
							</p>
							<div class="catvatar-option">
								<input
									type="radio"
									name="Catvatar"
									id="Astro-kitty"
									value="Astro-kitty"
								/>
								<img
									src="images/astro-kitty.png"
									alt="An illustrated cat wearing an astronaut suit"
								/>
								<label for="Astro-kitty">AstroCat</label>
							</div>
							<div class="catvatar-option">
								<input
									type="radio"
									name="Catvatar"
									id="Bubble-kitty"
									value="Bubble-kitty"
								/>
								<img
									src="images/bubble-kitty.png"
									alt="An illustrated orange cat making bubbles with its mouth open"
								/>
								<label for="Bubble-kitty">BubbleCat</label>
							</div>
							<div class="catvatar-option">
								<input
									type="radio"
									name="Catvatar"
									id="devil-kitty"
									value="devil-kitty"
								/>
								<img
									src="images/devil-kitty.png"
									alt="An illustrated cat with devil horns, a tail, and holding a trident"
								/>
								<label for="devil-kitty">DevilCat</label>
							</div>
							<div class="catvatar-option">
								<input
									type="radio"
									name="Catvatar"
									id="mad-scientist-kitty"
									value="mad-scientist-kitty"
								/>
								<img
									src="images/mad-science-kitty.png"
									alt="An illustrated cat dressed as a mad scientist with tiny glasses, wild hair, and holding a glass chemical doser"
								/>
								<label for="mad-scientist-kitty"
									>MadScientistCat</label
								>
							</div>
							<div class="catvatar-option">
								<input
									type="radio"
									name="Catvatar"
									id="robot-kitty"
									value="robot-kitty"
								/>
								<img
									src="images/robot-kitty.png"
									alt="An illustrated cat-like robot with mechanical features and a futuristic design"
								/>
								<label for="robot-kitty">RobotCat</label>
							</div>
							<button class="btn-register" onclick="playMusic()">
								<span class="btn-innerText">Register Now</span>
							</button>
						</form>
					</div>
				</div>
			</main>
		</div>
		<script src="index.js"></script>
	</body>
</html>
